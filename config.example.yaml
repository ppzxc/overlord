  #   provider: bukgu
  #   facility: gangdong
  #   zones: [일반데크, 필로티]
  #   checkIn: { from: 2026-10-14, to: 2026-10-30 }
  #   weekdays: [sun, mon, tue, wed, thu]
  #   nights: 1
  #   notify: [default]
  # - name: 당사 10월 복층데크
  #   provider: bukgu
  #   facility: dangsa
  #   zones: [복층데크(단독형), 복층데크(당사)]
  #   checkIn: { from: 2026-10-14, to: 2026-10-30 }
  #   nights: 1
  #   notify: [default]
