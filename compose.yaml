services:
  poller:
    build:
      context: .
      args:
        WITH_BROWSER: "false"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
    volumes:
      - ./config.yaml:/config/config.yaml:ro
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
