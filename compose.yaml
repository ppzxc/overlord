services:
  poller:
    build:
      context: .
      args:
        WITH_BROWSER: "false"
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Asia/Seoul
      # 숲나들e 로그인 실패 기록(자격증명 지문). 재시작해도 남게 호스트 폴더에 둔다.
      FORESTTRIP_LOGIN_STATE_FILE: /data/foresttrip-login-failure.json
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
