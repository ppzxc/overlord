# docker compose up 전에 config.yaml로 복사해서 쓴다.
# healthz.bind는 컨테이너 안에서 헬스체크가 찌르므로 127.0.0.1:8080을 그대로 둔다(포트를 밖으로 열지 않는다).
userAgentSuffix: ""
quietHours: { from: "23:00", to: "07:00" }
dailySummary: { enabled: true, at: "09:00" }
# hourlySummary는 KST 정각마다 예약처 상태를 무음으로 보낸다(기본 꺼짐). everyHours는 24의 약수(1, 2, 3, 4, 6, 8, 12, 24).
# quietHours 동안과 일일 요약과 같은 시각에는 보내지 않는다.
hourlySummary: { enabled: false, everyHours: 1 }
# deadManPingUrl에 URL을 넣으면 dead-man ping을 보낸다. 환경 변수는 주석 안에서도 치환되니 쓰지 않는 값은 아예 지운다.
healthz: { bind: "127.0.0.1:8080" }
providers:
  goraebul: { pollIntervalSeconds: 150 }
  # donghae: { pollIntervalSeconds: 150, openingRush: { from: "10:55", to: "11:30" } }  # 오픈 경쟁 시간(KST). 생략하면 예약처 기본값(동해시 10:55~11:30)
notifiers:
  default: { type: telegram, botToken: ${TELEGRAM_BOT_TOKEN}, chatId: ${TELEGRAM_CHAT_ID} }
watches:
  - name: 10월 주말 숲속야영장
    provider: goraebul
    zones: [DKA, DKB]
    checkIn: { from: 2026-10-01, to: 2026-10-31 }
    weekdays: [fri, sat]
    nights: 1
    notify: [default]
  # 울산 중구(입화산 제2오토 iphwa-auto2, 황방산 hwangbang, 태화연 taehwayeon): 시설은 facility, 구역은 예약처 값(csId)이다. 쓸 수 있는 값은 `catalog junggu`와 `catalog junggu <시설>`로 본다.
  # 최대 2박(화면 JS 근거)이고 두 박 모두 같은 자리가 열려 있어야 알린다. 기본 폴링 간격은 150초다.
  # - name: 태화연 10월
  #   provider: junggu
  #   facility: taehwayeon
  #   zones: [CP_SPEC_000000000006, CP_SPEC_000000000007]
  #   checkIn: { from: 2026-10-20, to: 2026-10-30 }
  #   nights: 2
  #   notify: [default]
  # 울산 북구(강동오토캠핑장 gangdong, 당사현대차오션캠프 dangsa): 시설은 facility, 구역은 표에 나오는 구역 이름이다(강동 일반데크·필로티·카라반, 당사 일반데크(단독형)·복층데크(단독형)·일반데크(당사)·복층데크(당사)).
  # 쓸 수 있는 값은 `catalog bukgu`와 `catalog bukgu <시설>`로 본다. 예약처가 한 번에 한 밤(1개소/1박)만 받아 nights는 1이다. 연박은 밤마다 날짜를 따로 건다. 기본 폴링 간격은 150초다.
  # 알림은 표가 "예약가능"이라고 하는 자리다. 다음 달 날짜는 추첨 대상이라 선착순 개시(결제 마감일 다음 월요일 10시 KST) 뒤에 예약처 달력이 열어 준 날부터 알린다(그 전에는 표가 모두 "예약가능"이어도 알리지 않는다).
